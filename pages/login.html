<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — GyaanSetu</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌉</text></svg>" />
</head>
<body style="background: linear-gradient(135deg, var(--primary) 0%, #1E5F8C 100%);">

<!-- LOGIN SECTION -->
<section class="form-section" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="container">
    
    <div class="form-card" style="max-width: 420px; margin: 0 auto; text-align: center; border: none;">
      
      <!-- Logo Graphic -->
      <div class="nav-logo-icon" style="margin: 0 auto 24px; width: 64px; height: 64px; font-size: 2rem;">🌉</div>
      
      <h2 class="section-title">Welcome Back</h2>
      <p class="section-subtitle" style="margin-bottom: 24px;">Log in to GyaanSetu</p>

      <!-- DUMMY FORM -->
      <form id="dummyLoginForm" novalidate onsubmit="event.preventDefault(); document.getElementById('loginBtn').innerHTML = 'Verifying...'; setTimeout(() => { window.location.href='../index.html' }, 800);">
        
        <div class="form-group" style="text-align: left;">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-input" placeholder="student@example.com" required />
        </div>

        <div class="form-group" style="text-align: left;">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" id="loginBtn" class="submit-btn" style="margin-top: 32px;">
          Secure Login
        </button>

      </form>

      <div style="margin-top: 24px; font-size: 0.85rem; color: var(--text-light);">
        For testing purposes, any email and password will be accepted right now.
      </div>
      
    </div>

  </div>
</section>

</body>
</html>
