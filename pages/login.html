<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Sign Up — GyaanSetu</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌉</text></svg>" />
  <style>
    .auth-tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .auth-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 600; color: var(--text-medium); transition: var(--transition); border-bottom: 3px solid transparent; }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .auth-form { display: none; text-align: left; }
    .auth-form.active { display: block; }
  </style>
</head>
<body style="background: linear-gradient(135deg, var(--primary) 0%, #1E5F8C 100%);">

<!-- LOGIN / SIGNUP SECTION -->
<section class="form-section" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="container">
    
    <div class="form-card" style="max-width: 460px; margin: 0 auto; text-align: center; border: none;">
      
      <!-- Logo Graphic -->
      <a href="../index.html" style="text-decoration:none; display:block;">
        <div class="nav-logo-icon" style="margin: 0 auto 16px; width: 64px; height: 64px; font-size: 2rem;">🌉</div>
        <h2 class="section-title">GyaanSetu</h2>
      </a>
      
      <div id="authAlert" class="alert"></div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Log In</div>
        <div class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</div>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active" novalidate onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="student@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
        </div>
        <button type="submit" id="loginBtn" class="submit-btn" style="margin-top: 24px;">Log In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form" novalidate onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label" for="signupName">Full Name <span class="required">*</span></label>
          <input type="text" id="signupName" class="form-input" placeholder="Rahul Kumar" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="signupEmail" class="form-input" placeholder="student@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password <span class="required">*</span></label>
          <input type="password" id="signupPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupBio">Short Bio (Optional)</label>
          <textarea id="signupBio" class="form-textarea" rows="2" placeholder="Hi, I am studying BSC IT and love coding..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupStrong">Strongest Subject</label>
          <select id="signupStrong" class="form-select" required>
            <option value="Coding">💻 Coding</option>
            <option value="English">📖 English</option>
            <option value="Maths">🔢 Maths</option>
            <option value="Digital Skills">📱 Digital Skills</option>
          </select>
          <div class="form-hint">Students can find you as a mentor for this subject.</div>
        </div>
        
        <button type="submit" id="signupBtn" class="submit-btn" style="margin-top: 24px;">Create Account</button>
      </form>
      
    </div>
  </div>
</section>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    document.getElementById('authAlert').style.display = 'none';

    if (tab === 'login') {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    } else {
      document.getElementById('tabSignup').classList.add('active');
      document.getElementById('signupForm').classList.add('active');
    }
  }
</script>
</body>
</html>
